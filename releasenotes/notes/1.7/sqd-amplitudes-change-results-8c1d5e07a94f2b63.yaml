---
upgrade:
  - |
    Multi-iteration SQD results computed through :func:`sbd.sbd_solver.solve_sci`
    or :func:`sbd.sbd_solver.solve_sci_batch` will differ from those of earlier
    releases. The wavefunction amplitudes returned to the SQD loop were
    previously replaced by a uniform array in the common case, and
    ``qiskit-addon-sqd`` selects each iteration's determinants from those
    amplitudes; the amplitudes are now correct, so the subspaces explored after
    the first iteration differ. See the corresponding entry under Bug Fixes.

    Single-iteration energies and orbital occupancies are unaffected: those come
    from SBD directly and were never derived from the amplitudes.
