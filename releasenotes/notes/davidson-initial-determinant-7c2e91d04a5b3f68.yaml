---
features:
  - |
    Davidson can now start from a chosen determinant instead of SBD's default, the
    first determinant of the subspace in sorted order. Davidson only reaches states
    its start overlaps with, so a poor start converges, without any error, on a
    higher state: a subspace whose first sorted determinant lies in a symmetry
    sector the ground state does not touch reports an energy 27 Ha too high in the
    new test. Upstream SBD already supports the explicit start; it is now exposed:

    - :func:`sbd.sbd_solver.solve_sci` and :func:`sbd.sbd_solver.solve_sci_batch`
      take ``initial_determinant=(alpha, beta)``, as CI-string integers.
    - ``TPB_SBD`` has ``initial_adeterminant_bitstring`` and
      ``initial_bdeterminant_bitstring``, and ``GDB_SBD`` has
      ``initial_determinant_bitstring``.
    - ``examples/tpb/run_sbd_diag.py`` takes ``--initial_adet``/``--initial_bdet``,
      and ``examples/gdb/run_gdb_diag.py`` takes ``--initial_det``.

    The determinant must be in the subspace. If it is not, the solve raises
    ``ValueError`` rather than falling back to the default start; ``solve_sci``
    checks this before calling SBD, so the message names the missing string.
