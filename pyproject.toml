[build-system]
requires = ["setuptools>=77.0.1", "wheel", "pybind11>=2.12.0", "mpi4py>=4.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbd-eigensolver"
version = "1.7.0"
description = "Python bindings for Selected Basis Diagonalization (SBD) library"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
keywords = ["quantum chemistry", "diagonalization", "tensor product basis", "MPI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
]
dependencies = [
    "mpi4py>=4.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
basetest = [
    "pytest>=8.0",
]
test = [
    "sbd-eigensolver[basetest]",
    "pytest-mpi>=0.6",
    # The SQD integration tests drive qiskit-addon-sqd's own entry point, and read the
    # reference Hamiltonian from a FCIDUMP with pyscf. Both are in the default test
    # extra rather than an opt-in one so that `tox -e py` and `tox -e mpi` cover that
    # path; the tests skip themselves if the imports are unavailable anyway.
    "qiskit-addon-sqd>=0.13.1",
    "pyscf>=2.9",
]
nbtest = [
    "sbd-eigensolver[basetest]",
    "nbmake>=1.5.0",
]
docs = [
    # The API reference is generated from the docstrings by autodoc, which imports the
    # package -- so the docs build needs the compiled extension, and `sbd.sbd_solver`
    # additionally needs qiskit-addon-sqd and pyscf importable. The `test` extra
    # already pulls both in.
    "sbd-eigensolver[test]",
    "qiskit-sphinx-theme~=2.1.0",
    "sphinx-copybutton",
    "reno>=4.1",
]
notebook-dependencies = [
    "qiskit-addon-sqd>=0.13.1",
    "pyscf>=2.9",
]

[dependency-groups]
# The linters live in dependency groups rather than optional-dependencies: they are
# never installed alongside the package (the lint envs set `skip_install`), so there is
# no reason to publish them as extras in the wheel metadata.
style = [
    "ruff==0.16.9",
]
lint = [
    {include-group = "style"},
    "reno>=4.1",
]

[project.urls]
Homepage = "https://github.com/Qiskit/sbd-eigensolver-python"
Documentation = "https://github.com/Qiskit/sbd-eigensolver-python"
Repository = "https://github.com/Qiskit/sbd-eigensolver-python"
Issues = "https://github.com/Qiskit/sbd-eigensolver-python/issues"

[tool.setuptools]
# The extension modules (and their MPI/BLAS/NVHPC build logic) are declared
# imperatively in setup.py; everything else lives in [project] above.
packages = ["sbd"]
package-dir = {sbd = "python"}
zip-safe = false

[tool.ruff]
line-length = 100
src = ["python", "test"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.extend-per-file-ignores]
"test/**.py" = [
    "D",  # pydocstyle
]
"docs/**/*" = [
    "E402", # module level import not at top of file
    "D",    # pydocstyle
]
# The examples are written to be read top to bottom, so their helpers carry an
# explanatory comment rather than a docstring, and the prose uses the same
# mathematical symbols (alpha, the minus sign, the multiplication sign) as the
# surrounding discussion.
"examples/**/*" = [
    "D",      # pydocstyle
    "I001",   # unsorted-imports: see the isort note below
    "RUF001", # ambiguous unicode character in string
    "RUF003", # ambiguous unicode character in comment
    "SIM102", # collapsible if: the nesting mirrors the explanation
]
# `i, j, k, l` is the FCIDUMP two-electron integral index order, so `l` here is
# the name the file format uses rather than an ambiguous identifier.
"python/sbd_solver.py" = [
    "E741", # ambiguous variable name
]
# `__all__` is grouped by topic with comments, which sorting would flatten.
"python/__init__.py" = [
    "RUF022", # `__all__` is not sorted
]

[tool.ruff.lint.isort]
# The package directory is `python/` but it imports as `sbd` (see
# `[tool.setuptools] package-dir`), so isort cannot infer that `sbd` is ours and
# would otherwise group it with the third-party imports.
#
# This makes `sbd` its own import group, which isort separates with a blank line.
# That is what we want in `python/` and `test/`, but in the examples it splits
# short function-local blocks like `from mpi4py import MPI` next to `import sbd`
# for no gain, so `I001` is ignored for `examples/` above.
known-first-party = ["sbd"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-copyright]
notice-rgx = """
# This code is a Qiskit project.
#
# \\(C\\) Copyright IBM \\d{4}((,\\s)\\d{4})*\\.
#
# This code is licensed under the Apache License, Version 2\\.0\\. You may
# obtain a copy of this license in the LICENSE\\.txt file in the root directory
# of this source tree or at http\\:\\/\\/www\\.apache\\.org\\/licenses\\/LICENSE\\-2\\.0\\.
#
# Any modifications or derivative works of this code must retain this
# copyright notice, and modified files need to carry a notice indicating
# that they have been altered from the originals\\.
"""

[tool.pytest.ini_options]
testpaths = ["test"]
# -rs lists the skipped tests and why, which matters here because most of the suite
# skips by default: a bare count of skips would not distinguish "this case is slow" or
# "this backend was not built" from "the reference data is missing". --durations shows
# where the time goes, the cases differing by orders of magnitude in cost.
addopts = "-rs --durations=10"
