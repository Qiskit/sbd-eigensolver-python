name: Lint check

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # reno reads the notes from git history, so `reno lint` needs more than a
          # shallow clone. The submodule the tests need is not checked out: the lint
          # environment sets `skip_install`, so nothing here compiles the extension.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Run lint check
        shell: bash
        run: |
          tox -elint
