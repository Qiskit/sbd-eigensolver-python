name: Minimum version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

jobs:
  tests:
    name: minimum version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The reference energies the tests check against come from data in the
          # vendored upstream checkout, and setup.py needs its headers to compile.
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MPI and BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libopenblas-dev
      - name: Install dependencies (minimum versions)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'extremal-python-dependencies<2'
          pip install "tox==$(extremal-python-dependencies get-tox-minversion)"
          extremal-python-dependencies pin-dependencies-to-minimum --inplace
      - name: Test using tox environments
        shell: bash
        run: |
          tox -e py,notebook,mpi
