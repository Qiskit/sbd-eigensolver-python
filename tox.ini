[tox]
minversion = 4.28.0
envlist = py{311,312,313,314}{,-notebook}, mpi, docs
isolated_build = True

[testenv]
# Build a wheel once and install it into every environment, rather than the default
# sdist which each environment would compile for itself. Compiling the extension is
# the slowest part of a run, so doing it once matters.
package = wheel
wheel_build_env = .pkg
# The extension modules are compiled against whatever MPI and BLAS the environment
# provides, so the build cannot be isolated from it: pass the variables setup.py
# consults through to the build and to the tests.
passenv =
    MPI_HOME
    BLAS_LIB_PATH
    BLAS_LIBS
    NVHPC_HOME
    ROCM_HOME
    ROCM_PATH
    SBD_GPU_VENDOR
    SBD_GPU_ARCH
    SBD_BUILD_BACKEND
    SBD_TEST_DEVICE
    SBD_TEST_NPROCS
    CC
    CXX
    OMP_NUM_THREADS
    PATH
    LD_LIBRARY_PATH
# Work around Qiskit/qiskit#17213: with qiskit 2.6.0 installed, importing our
# extension fails on Linux with "cannot allocate memory in static TLS block".
#
# glibc sizes the per-thread TLS block at startup and keeps only a small surplus for
# libraries dlopen'ed afterwards that need initial-exec TLS. Every Python extension
# arrives that way, so they all draw on that surplus. qiskit 2.6.0's _accelerate grew
# from 736 to 1544 bytes of it (matrixmultiply 0.3.11 enabling AVX-512 kernels, which
# quadruple one thread-local buffer), which leaves too little for the libgomp our
# extension pulls in. The error names libgomp, but it is whoever asks last that fails.
#
# Raising the surplus restores the headroom. It is reserved per thread and only commits
# the pages actually used, so a generous value costs little. Drop this once 17213 is
# fixed upstream.
#
# Linux-only: this is a glibc mechanism, and macOS links libomp with no equivalent
# limit. Note glibc silently ignores an unrecognized tunable name, so a typo here looks
# like a working config.
setenv =
    linux: GLIBC_TUNABLES = glibc.rtld.optional_static_tls=65536
extras =
    test
commands =
    pytest {posargs}

[testenv:mpi]
# Run the tests marked `mpi` under a launcher, and only those: the rest of the suite
# is single-process, and running it under mpirun would just repeat each test once per
# rank. `--only-mpi` selects them; note that it must be used *without* `--with-mpi`,
# since pytest-mpi checks the two in an if/elif and the latter takes precedence,
# which would quietly run everything.
#
# Two processes is enough to tell a genuinely distributed code path from one that only
# works on a single rank, so that is the default. Override it to use more:
#
#     SBD_TEST_NPROCS=8 tox -e mpi
#
# Note that `mpirun` is not installed by tox, so the environment must already provide
# it -- on a cluster that usually means loading a module first.
allowlist_externals =
    mpirun
setenv =
    SBD_TEST_NPROCS = {env:SBD_TEST_NPROCS:2}
    # setenv is replaced, not merged, in a child environment, so repeat the
    # static-TLS headroom [testenv] sets; see the comment there.
    linux: GLIBC_TUNABLES = glibc.rtld.optional_static_tls=65536
commands =
    mpirun -n {env:SBD_TEST_NPROCS} pytest --only-mpi {posargs}

# Spelled out with the hyphen outside the braces. Writing this as
# {,py311-,py312-,...}notebook does not work: tox expands numeric ranges in a section
# name before splitting it on braces, so `py314-` parses as `py3` plus the range `14-`,
# which produces junk environment names and never defines py311-notebook and friends --
# those then silently fall through to [testenv] and run the unit tests instead. Nesting
# braces is not an alternative either; it crashes tox outright.
[testenv:{notebook,py311-notebook,py312-notebook,py313-notebook,py314-notebook}]
# nbmake runs each notebook with its own directory as the working directory, so the
# relative paths the examples use to reach the vendored data resolve as they would for
# someone running the notebook by hand.
extras =
    nbtest
    notebook-dependencies
commands =
    pytest --nbmake --nbmake-timeout=3000 {posargs} examples/

[testenv:style]
# Linting reads the source; it does not import the package, so there is no reason to
# compile the extension for it. `skip_install` keeps `tox -e style` fast and lets it
# run on a machine with no MPI or BLAS at all.
skip_install = true
dependency_groups =
    style
allowlist_externals =
    ruff
commands =
    ruff check --fix python/ test/ docs/ examples/

[testenv:lint]
skip_install = true
dependency_groups =
    lint
allowlist_externals =
    reno
    ruff
commands =
    ruff check python/ test/ docs/ examples/
    # The copyright-header check is a separate invocation: it needs --preview, and the
    # notebook is excluded because the header belongs in the .py sources only.
    ruff check --preview --select CPY001 --exclude "*.ipynb" python/ test/ docs/ examples/
    reno lint

[testenv:docs]
# Unlike a pure-Python project, the docs build cannot skip installing the package:
# autodoc imports `sbd` to read its docstrings, and conf.py reads the version from the
# installed distribution metadata. `package`/`wheel_build_env` and the MPI/BLAS
# `passenv` are therefore inherited from [testenv] -- the extension has to compile
# here just as it does for the tests, and it reuses the same wheel.
extras =
    docs
passenv =
    {[testenv]passenv}
    # Consulted by conf.py's determine_github_branch() to aim the source-code links at
    # the right branch.
    CI
    GITHUB_BASE_REF
    GITHUB_REF_NAME
commands =
    sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html

[testenv:docs-clean]
skip_install = true
allowlist_externals =
    rm
commands =
    rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/

[testenv:slow]
# The reference cases grow by roughly an order of magnitude in determinant count per
# row of the upstream tables, and compute time scales worse than linearly in that, so
# these are opt-in rather than part of the default run.
commands =
    pytest --run-slow {posargs}
